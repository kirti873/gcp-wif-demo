name: WIF Demo

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: wif-demo-506206
          workload_identity_provider: projects/1087343002122/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@wif-demo-506206.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: List bucket contents
        run: gsutil ls gs://wif-demo2-bucket

      - name: Read the test file
        run: gsutil cat gs://wif-demo2-bucket/demo.txt
